name: CI - build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.20'
      - name: Build
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            go build -o godo.exe .
            ls -lah godo.exe
          else
            go build -o godo .
            ls -lah godo
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: godo-${{ matrix.os }}
          path: |
            godo
            godo.exe
